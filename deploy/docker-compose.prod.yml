services:
  nuvita-landing:
    image: ghcr.io/vandyahmad24/nuvita-ai-landing:latest
    container_name: nuvita-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:4012:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
