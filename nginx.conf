server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hindari downgrade ke http:// pada redirect trailing-slash saat berada di
    # belakang reverse proxy (TLS di-terminate di proxy). Pakai redirect relatif
    # agar browser tetap memakai skema https dari permintaan asli.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
